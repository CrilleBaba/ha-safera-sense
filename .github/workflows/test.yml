name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      # TODO: drop once safera-sense-ble is published on PyPI; the
      # manifest pin (safera-sense-ble==0.1.0) will then resolve there.
      - run: pip install git+https://github.com/christophebaraer/safera-sense-ble.git@main
      - run: pytest tests -v
