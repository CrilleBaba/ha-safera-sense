name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      # Install the exact library version the manifest pins, so this CI
      # never drifts from the released requirement.
      - run: pip install "$(python3 -c "import json; print(json.load(open('custom_components/safera_sense/manifest.json'))['requirements'][0])")"
      - run: pytest tests -v
